# XcodeGen project definition.
# On the Mac, run `xcodegen` in this folder to (re)generate Taalhulp.xcodeproj.
# Never edit the .xcodeproj by hand - edit this file and regenerate.

name: Taalhulp

options:
  bundleIdPrefix: com.victorpiaskowski
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Put your Apple Team ID here (Xcode > Settings > Accounts > your Apple ID > Team).
    DEVELOPMENT_TEAM: "77SYDZU8AM"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  KeyboardCore:
    path: Packages/KeyboardCore

targets:
  # The main app: onboarding + settings + (later) learning log.
  Taalhulp:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: TaalhulpKeyboard
      - package: KeyboardCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Taalhulp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Lets the app talk to your own servers on your Wi-Fi (Ollama, the translation server).
        NSLocalNetworkUsageDescription: Taalhulp connects to your own servers (e.g. Ollama or the translator on your PC or Raspberry Pi) for grammar help and translations.
        # Your own servers speak plain http, also over Tailscale (100.x addresses and *.ts.net
        # names), which iOS doesn't count as "local". Claude and LanguageTool still use https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Taalhulp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.victorpiaskowski.taalhulp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorpiaskowski.taalhulp
        # App/Assets.xcassets/AppIcon.appiconset, drawn by Tools/make_app_icon.swift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The keyboard extension itself.
  TaalhulpKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
    dependencies:
      - package: KeyboardCore
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Taalhulp
        NSLocalNetworkUsageDescription: Taalhulp connects to your own servers (e.g. Ollama or the translator on your PC or Raspberry Pi) for grammar help and translations.
        # Plain http to your own servers, also over Tailscale (see the app target above).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: nl-NL
            # Needed for network calls (LanguageTool, Claude, local LLM) and the shared App Group.
            RequestsOpenAccess: true
    entitlements:
      path: KeyboardExtension/TaalhulpKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.victorpiaskowski.taalhulp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorpiaskowski.taalhulp.keyboard
