# Builds Taalhulp.ipa on a GitHub-hosted Mac on every push, and runs the KeyboardCore tests.
# No Mac or Apple ID needed: the run replaces Taalhulp.ipa in the "latest" release. The Windows
# refresh (Tools/windows/Watch-iPhone.ps1) downloads it when the iPhone is plugged in, then signs
# and installs it.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true   # a newer push stops the older run (saves macOS minutes)

permissions:
  contents: write   # to update the "latest" release

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build app and keyboard (iPhone, unsigned)
        # The full log is long; on failure, show the errors and the end of the log.
        run: |
          if xcodebuild build \
              -project Taalhulp.xcodeproj \
              -scheme Taalhulp \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E 'warning:' build.log | sort -u || true
            echo "BUILD SUCCEEDED"
          else
            grep -E 'error:' build.log | sort -u || true
            tail -40 build.log
            exit 1
          fi

      - name: Package Taalhulp.ipa
        # No Apple ID here: an ad-hoc signature ("-") only carries the entitlements (the App Group).
        # The Windows refresh (plumesign) reads them from it and signs the app for real with your Apple ID.
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/Taalhulp.app
          codesign --force --sign - --entitlements KeyboardExtension/TaalhulpKeyboard.entitlements \
            "$APP/PlugIns/TaalhulpKeyboard.appex"
          codesign --force --sign - --entitlements App/Taalhulp.entitlements "$APP"
          # Stop here if the App Group didn't make it in (settings would not reach the keyboard).
          codesign -d --entitlements - "$APP/PlugIns/TaalhulpKeyboard.appex" 2>&1 | grep -q application-groups
          codesign -d --entitlements - "$APP" 2>&1 | grep -q application-groups
          # Plain http to your own servers (Ollama, translator) over Tailscale needs exactly this:
          # NSAllowsArbitraryLoads on, and no NSAllowsLocalNetworking (which would switch it off).
          for PLIST in "$APP/Info.plist" "$APP/PlugIns/TaalhulpKeyboard.appex/Info.plist"; do
            if [ "$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw "$PLIST" 2>/dev/null)" != "true" ] ||
               plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw "$PLIST" >/dev/null 2>&1; then
              echo "::error::$PLIST: http to your own servers would be blocked (check NSAppTransportSecurity in project.yml)"
              exit 1
            fi
          done
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          rm -f build/Taalhulp.ipa
          (cd ipa && zip -qry ../build/Taalhulp.ipa Payload)
          rm -rf ipa
          ls -lh build/Taalhulp.ipa

      - name: Replace Taalhulp.ipa in the "latest" release
        # Only for pushes to main. One release, one file, replaced each time: the repo doesn't grow,
        # and the download link never changes:
        #   https://github.com/<owner>/<repo>/releases/download/latest/Taalhulp.ipa
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Created by the Build workflow."
          gh release upload latest build/Taalhulp.ipa --clobber
          gh release edit latest --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). The Windows refresh (Tools/windows) downloads it when the iPhone is plugged in."

      - name: Test KeyboardCore
        working-directory: Packages/KeyboardCore
        run: swift test
