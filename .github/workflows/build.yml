# Builds Taalhulp.ipa on a GitHub-hosted Mac on every push, and runs the KeyboardCore tests.
# No Mac or Apple ID needed: download the "Taalhulp-ipa" artifact from the run, and the Windows
# refresh (Tools/windows) signs and installs it:  .\Setup-AutoRefresh.ps1 -Ipa .\Taalhulp.ipa -UpdateIpaOnly
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true   # a newer push stops the older run (saves macOS minutes)

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build app and keyboard (iPhone, unsigned)
        # The full log is long; on failure, show the errors and the end of the log.
        run: |
          if xcodebuild build \
              -project Taalhulp.xcodeproj \
              -scheme Taalhulp \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E 'warning:' build.log | sort -u || true
            echo "BUILD SUCCEEDED"
          else
            grep -E 'error:' build.log | sort -u || true
            tail -40 build.log
            exit 1
          fi

      - name: Package Taalhulp.ipa
        # No Apple ID here: an ad-hoc signature ("-") only carries the entitlements (the App Group).
        # The Windows refresh (plumesign) reads them from it and signs the app for real with your Apple ID.
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/Taalhulp.app
          codesign --force --sign - --entitlements KeyboardExtension/TaalhulpKeyboard.entitlements \
            "$APP/PlugIns/TaalhulpKeyboard.appex"
          codesign --force --sign - --entitlements App/Taalhulp.entitlements "$APP"
          # Stop here if the App Group didn't make it in (settings would not reach the keyboard).
          codesign -d --entitlements - "$APP/PlugIns/TaalhulpKeyboard.appex" 2>&1 | grep -q application-groups
          codesign -d --entitlements - "$APP" 2>&1 | grep -q application-groups
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Taalhulp.ipa Payload)
          ls -lh Taalhulp.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Taalhulp-ipa
          path: Taalhulp.ipa
          retention-days: 30

      - name: Test KeyboardCore
        working-directory: Packages/KeyboardCore
        run: swift test
